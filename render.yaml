services:
  - type: web
    name: docvane-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PROJECT_NAME
        value: Docvane
      - key: S3_ENDPOINT_URL
        value: local
      - key: CORS_ORIGINS
        value: "*"
      - key: DEFAULT_LLM_MODEL
        value: gemini/gemini-3.5-flash-lite
      - key: EMBEDDING_MODEL
        value: gemini/gemini-embedding-001
      - key: USE_CELERY
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

